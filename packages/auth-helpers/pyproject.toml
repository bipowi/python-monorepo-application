[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-helpers"
version = "0.1.0"
description = "Authentication helpers package"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "stendhal.son", email = "stendhal.son@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.hatch.envs.default.scripts]
lint = "uv run ruff check ."
format = "uv run ruff format ."
test = "uv run pytest"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_helpers"]
