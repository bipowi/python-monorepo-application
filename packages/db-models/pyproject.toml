[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-models"
version = "0.1.0"
description = "Database models package"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "stendhal.son", email = "stendhal.son@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.hatch.envs.default.scripts]
lint = "uv run ruff check ."
format = "uv run ruff format ."
test = "uv run pytest"

[tool.hatch.build.targets.wheel]
packages = ["src/db_models"]
