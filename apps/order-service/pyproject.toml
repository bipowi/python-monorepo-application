[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-service"
version = "0.1.0"
description = "Order service application"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "stendhal.son", email = "stendhal.son@gmail.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "db-models",
    "api-client",
    "logging-config",
]

[tool.uv.sources]
db-models = { workspace = true }
api-client = { workspace = true }
logging-config = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.hatch.envs.default.scripts]
start = "python -m order_service"
lint = "uv run ruff check ."
format = "uv run ruff format ."
test = "uv run pytest"

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]
